<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sketch sandbox</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #err {
    position: fixed; inset: 0; padding: 12px;
    font: 11px/1.5 ui-monospace, monospace;
    color: #ff8080; background: rgba(0,0,0,.92);
    white-space: pre-wrap; overflow: auto; display: none;
  }
</style>
</head>
<body>
<div id="err"></div>
<script src="/vendor/p5.min.js"></script>
<script>
/*
 * Sandbox bootstrap.
 *
 * Runs in an iframe with a null origin. Receives sketch source over
 * postMessage, evaluates it here, and reports schema, errors, and a heartbeat
 * back to the host. Nothing in here can reach the host page's DOM or state.
 */
(function () {
  var instance = null;
  var params = {};
  var errEl = document.getElementById('err');
  var frame = 0;
  var lastFpsAt = performance.now();
  var fpsFrames = 0;
  var fps = 0;
  var profileEnabled = false;
  var drawTimings = [];
  var captureTimings = [];
  function profileSample(samples, elapsed) {
    if (!profileEnabled || !Number.isFinite(elapsed)) return;
    samples.push(elapsed);
    if (samples.length > 120) samples.shift();
  }
  function profileP95(samples) {
    if (!samples.length) return null;
    var values = samples.slice().sort(function(a,b){ return a-b; });
    samples.length = 0;
    return values[Math.floor((values.length-1)*0.95)];
  }
  var paused = false;
  var quality = 'preview';
  // Set at the top of every run() and never anywhere else — the one thing
  // webglcontextrestored needs to fully recreate the sketch from scratch.
  var lastSource = '';
  // True between a context-loss event and successful recovery. draw()
  // checks this so it doesn't keep calling into a dead WebGL context every
  // frame while waiting — that would either throw repeatedly or silently
  // no-op depending on the browser, neither of which is better than just
  // pausing until restoration actually happens.
  var contextLost = false;
  // Latched once the sketch's own draw() throws — see the try/catch around
  // userDraw.call(p) below for why this exists at all. Stays true for the
  // rest of this instance's life (a fresh mount clears it, same as
  // contextLost's recovery path is a genuinely different situation:
  // recoverable vs. not). Checked in the same guard as contextLost so a
  // failed sketch doesn't keep re-throwing into an already-reported error.
  var drawFailed = false;
  // Backoff bookkeeping for webglcontextrestored — see the comment at that
  // listener for why unconditional recreation on every loss is unsafe.
  var lastRecoveryAt = 0;
  var recoveryStreak = 0;
  // Debounce handle for the windowResized guard below. Module-scoped (not
  // local to run()'s p5 closure) so teardown() can always cancel a pending
  // call regardless of which run() scheduled it — otherwise a timer from a
  // just-torn-down instance could fire into a disposed `p` afterwards.
  var resizeDebounceTimer = null;
  // Set inside run(), for the outer message handler below to call directly
  // when the host sends an explicit 'resize' message — see the comment at
  // that handler for why this exists alongside the internal debounce.
  var applyResize = null;
  // Set whenever the host's explicit 'resize' message is handled — lets
  // the internal fallback below tell "the host already covered this" from
  // "the host never sent anything," instead of firing unconditionally and
  // racing it. See the case 'resize' handler for the full story.
  var lastHostResizeAt = 0;
  // The iframe's own window dimensions AT THE MOMENT applyResize() last
  // ran. Recorded so the windowResized fallback below can tell "the host
  // already handled this exact size" (skip — the sketch has already been
  // resized correctly, running again would just be a duplicate
  // resizeCanvas) from "the host handled an OLDER size and the window has
  // moved on since" (don't skip — this is the only remaining path back to
  // the correct size). A purely time-based guard couldn't tell those
  // apart, which is what let a stale mid-transition size stick. See the
  // windowResized wrapper in run() for the full story.
  var lastAppliedWindowW = 0;
  var lastAppliedWindowH = 0;
  // Live audio bridge — see lib/sandbox/protocol.ts's audioWaveform doc.
  // audioEnabled mirrors the host's isTileAudioActive() for this card;
  // audioWaveform is the current time-domain buffer, or null whenever
  // audioEnabled is false (never a stale buffer left over from before
  // sound was switched off — the 'audioWaveform' case below clears it
  // explicitly on every message, not just when a new buffer arrives).
  var audioEnabled = false;
  var audioWaveform = null;
  // Same idea as audioWaveform above, for the per-band scalars — see
  // HostToSandbox's `bands` field doc in protocol.ts. Track-only, so
  // this is null far more often than audioWaveform is (mic/synth-preset
  // audio never sets it), which is intentional, not a bug to "fix" by
  // falling back to something else here — the sketch is meant to see
  // that distinction.
  var audioBands = null;
  // Full 64-bin frequency array, track OR mic — see HostToSandbox's
  // `spectrum` doc in protocol.ts. audioSpectrumBinHz is the real Hz
  // width of each bin (device sample rate dependent), sent alongside it
  // so a sketch can bucket bins into actual Hz ranges rather than
  // guessing a sample rate.
  var audioSpectrum = null;
  var audioSpectrumBinHz = 0;
  // Embedded fonts — see lib/sandbox/protocol.ts's `fonts` field doc for
  // why these arrive as base64 data: URLs rather than being fetched by
  // this iframe itself (null-origin CORS problem). `fontDataUrls`
  // persists across run() calls — a hot-reload of the sketch source
  // shouldn't have to re-request font data the host already sent this
  // session. `embeddedFonts` (the actual loaded p5.Font objects) does
  // NOT persist — those belong to whichever p5 instance loaded them, and
  // run() tears down and replaces `instance` on every call (a fresh
  // canvas, a fresh WebGL context after recovery, etc.), so they're
  // reloaded into each new instance from the retained data URLs instead
  // of trusting a p5.Font object to remain valid past its own instance's
  // lifetime.
  var fontDataUrls = {};
  var embeddedFonts = {};

  /**
   * Records newly-received font data and loads whichever entries aren't
   * already loaded into the CURRENT instance. Safe to call before an
   * instance exists yet (a 'fonts' message can arrive before 'init',
   * depending on postMessage timing) — loadFontIntoCurrentInstance()
   * below no-ops until `instance` is set, and loadAllKnownFontsIntoCurrentInstance()
   * catches up every retained id once run() actually creates one.
   */
  function loadEmbeddedFonts(list) {
    if (!list) return;
    for (var i = 0; i < list.length; i++) {
      var f = list[i];
      if (!f || !f.id || !f.dataUrl) continue;
      fontDataUrls[f.id] = f.dataUrl;
      loadFontIntoCurrentInstance(f.id, f.dataUrl);
    }
  }

  function loadFontIntoCurrentInstance(id, dataUrl) {
    if (!instance || embeddedFonts[id]) return;
    try {
      // p.loadFont on a data: URL works the same as any other URL —
      // decoding a data URL never triggers a CORS/origin check, so this
      // is fine to call directly inside this null-origin sandbox.
      instance.loadFont(dataUrl, function (f) { embeddedFonts[id] = f; });
    } catch (e) {
      // A bad font file shouldn't take the sketch down — p.getEmbeddedFont
      // just keeps returning null for this id, same as "still loading."
    }
  }

  function loadAllKnownFontsIntoCurrentInstance() {
    for (var id in fontDataUrls) {
      if (Object.prototype.hasOwnProperty.call(fontDataUrls, id)) {
        loadFontIntoCurrentInstance(id, fontDataUrls[id]);
      }
    }
  }

  /*
   * Pixel density is the difference between a smooth thumbnail and a
   * stuttering one. p5 defaults to the display density, so on a retina
   * screen every sketch was rendering at 2x — four times the pixels — even
   * for a 220px card. Preview cards are forced to 1x; only the focused
   * view pays for the sharper buffer.
   *
   * That flat "2x on retina, always" rule broke down at fullscreen size.
   * A confirmed A/B test (same sketches, same GPU, retina vs. non-retina
   * display) showed WEBGL sketches losing context specifically on retina
   * fullscreen and nowhere else — the drawing buffer at native fullscreen
   * resolution * 2x density is a real, large one-shot GPU allocation, and
   * that combination is what a driver actually chokes on, not the resize
   * event timing. The same 2x-everywhere rule is also the leading
   * suspect for the general stutter on retina, independent of fullscreen:
   * every WEBGL sketch pushes 4x the pixels per frame at "full" quality
   * whenever a retina display is involved, all the time.
   *
   * Budgeting by total framebuffer pixel count rather than a flat
   * multiplier keeps both costs bounded: a small enlarged-tile card still
   * gets the full 2x sharpness (its pixel count is nowhere near the
   * budget), while fullscreen on retina scales density back down rather
   * than compounding a large canvas with a large multiplier.
   */
  /*
   * Density budgets, split by RENDERER MODE.
   *
   * There was one flat 4,000,000 constant here. It exists for a real
   * reason: a flat min(devicePixelRatio, 2) multiplier at native retina
   * fullscreen produced a large enough one-shot WebGL drawing-buffer
   * allocation to trigger CONTEXT_LOST_WEBGL on some GPU drivers (see §15
   * of the implementation plan). Budgeting total pixels fixed that.
   *
   * But it was applied to every sketch regardless of mode, and that is
   * where it over-corrected. A 2D p5 sketch has no WebGL drawing buffer at
   * all — its canvas is a 2D context, so the GPU driver limit the constant
   * was protecting against simply does not apply to it. Its constraints are
   * memory and the browser's own canvas area cap, both far higher. Yet on a
   * DPR-2 display the shared budget dropped 2D sketches from density 1.92
   * in the enlarged panel to 1.39 in fullscreen — a 28% linear resolution
   * loss, taken to avoid a failure mode those sketches cannot have.
   *
   * So the budget is now per-mode, detected via p5's own `_renderer.isP3D`
   * flag (which p5 itself branches on throughout, so it is stable API in
   * practice):
   *
   *   2D    — 20M px. Roughly 80MB of canvas backing store for the one
   *           focused tile, comfortably under Chrome's ~268M area cap.
   *           Covers full DPR-2 density up to ~3160x1580 logical, which is
   *           every realistic desktop fullscreen.
   *   WEBGL — 8.4M px. Deliberately raised, but only to the point where a
   *           1920x1080 logical surface at DPR 2 (8.29M) fits exactly, so
   *           fullscreen on a 4K panel in HiDPI mode renders at native
   *           resolution. Beyond that it still scales down.
   *
   * The WEBGL raise is the one carrying real risk, so it is not a bare
   * constant — see WEBGL_PIXELS_FLOOR and the webglcontextlost handler
   * below for the automatic backoff that makes it self-correcting.
   */
  var MAX_2D_PIXELS = 20000000;
  var MAX_WEBGL_PIXELS = 8400000;
  /*
   * Backoff floor: the exact value that shipped before this change and ran
   * in the field without a reported loss. If raising the WEBGL budget turns
   * out to be wrong on a given machine, that machine walks itself back down
   * to a known-good number rather than to a fresh guess.
   *
   * Why backoff rather than the localStorage high-water mark that was
   * originally proposed: this iframe is served with sandbox="allow-scripts"
   * and WITHOUT allow-same-origin (see p5.renderer.ts), so it has a null
   * origin and any localStorage access throws a SecurityError. Persisting
   * the discovered ceiling has to live on the host side and be passed in
   * over the protocol — worth doing, but it is host plumbing rather than a
   * sandbox change, and it is deliberately not in this round. The cost of
   * leaving it out is that a machine which does lose context pays the
   * discovery once per session instead of once ever.
   */
  var WEBGL_PIXELS_FLOOR = 4000000;
  /*
   * Lowered permanently (for this iframe's lifetime) by the
   * webglcontextlost handler. Never raised.
   */
  var webglPixelBudget = MAX_WEBGL_PIXELS;

  /*
   * Which budget applies right now. Before createCanvas() has run there is
   * no renderer to inspect and the mode is genuinely unknown, so this
   * returns the conservative WEBGL branch; the setup wrapper reconciles
   * immediately afterwards once the mode is knowable.
   */
  function budgetForRenderer(renderer) {
    if (!renderer) return webglPixelBudget;
    return renderer.isP3D ? webglPixelBudget : MAX_2D_PIXELS;
  }

  function densityForRenderer(renderer, q, targetW, targetH) {
    if (q !== 'full') return 1;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = targetW || window.innerWidth;
    var h = targetH || window.innerHeight;
    var logicalPixels = w * h;
    if (logicalPixels <= 0) return dpr;
    var budget = budgetForRenderer(renderer);
    if (logicalPixels * dpr * dpr <= budget) return dpr;
    // Scale density down so total framebuffer pixels stay under budget,
    // never below 1 — a canvas this large already costs plenty at 1x.
    return Math.max(1, Math.sqrt(budget / logicalPixels));
  }

  function densityFor(q, targetW, targetH) {
    return densityForRenderer(instance && instance._renderer, q, targetW, targetH);
  }

  // Host-pulled frame transport. One snapshot in flight, bounded by host
  // dimensions and independent of the sketch's own draw frequency.
  var vfxRequest = null, vfxBusy = false;
  function sendVfxFrame() {
    if (!vfxRequest || vfxBusy) return;
    var request = vfxRequest; vfxRequest = null;
    var cv = document.querySelector('canvas');
    if (!cv || typeof createImageBitmap !== 'function') {
      post({type:'vfx-frame',requestId:request.requestId}); return;
    }
    vfxBusy = true;
    var captureStarted = profileEnabled ? performance.now() : 0;
    try {
      createImageBitmap(cv, {resizeWidth:request.width,resizeHeight:request.height,resizeQuality:'high'})
        .then(function(bitmap) {
          if (profileEnabled) profileSample(captureTimings, performance.now() - captureStarted);
          try { parent.postMessage({type:'vfx-frame',requestId:request.requestId,bitmap:bitmap}, '*', [bitmap]); }
          catch (error) { bitmap.close(); post({type:'vfx-frame',requestId:request.requestId}); }
        }, function() { post({type:'vfx-frame',requestId:request.requestId}); })
        .finally(function(){vfxBusy=false;});
    } catch (error) { vfxBusy=false;post({type:'vfx-frame',requestId:request.requestId}); }
  }

  function post(msg) { parent.postMessage(msg, '*'); }

  function showError(message, stack) {
    errEl.style.display = 'block';
    errEl.textContent = message + (stack ? '\n\n' + stack : '');
    post({ type: 'error', message: message, stack: stack });
  }

  function clearError() {
    errEl.style.display = 'none';
    errEl.textContent = '';
  }

  window.onerror = function (message, _src, line, col, error) {
    showError(String(message) + ' (line ' + line + ':' + col + ')', error && error.stack);
    return true;
  };

  window.addEventListener('unhandledrejection', function (e) {
    showError('Unhandled promise rejection: ' + String(e.reason));
  });

  function get(id) {
    var v = params[id];
    return v === undefined ? null : v;
  }

  function teardown() {
    if (resizeDebounceTimer) {
      clearTimeout(resizeDebounceTimer);
      resizeDebounceTimer = null;
    }
    applyResize = null;
    // Zeroed alongside applyResize: a fresh instance starts with no
    // host-applied resize to its name, and leaving these set could let the
    // new sketch's first windowResized be skipped on the strength of the
    // previous instance's bookkeeping.
    lastAppliedWindowW = 0;
    lastAppliedWindowH = 0;
    if (instance && instance.remove) {
      try { instance.remove(); } catch (e) { /* already gone */ }
    }
    instance = null;
    // Loaded p5.Font objects belong to the instance that's about to be
    // gone — not fontDataUrls itself, which the host doesn't need to
    // resend just because the sketch source reloaded.
    embeddedFonts = {};
    var c = document.querySelectorAll('canvas');
    for (var i = 0; i < c.length; i++) c[i].remove();
  }

  function run(source) {
    teardown();
    clearError();
    frame = 0;
    lastSource = source;
    contextLost = false;

    var factory, declared;

    try {
      // Strip ES module syntax: the sandbox evaluates a plain script so it
      // works without a build step and without dynamic import of blob URLs.
      var code = source
        .replace(/export\s+default\s+function\s+(\w+)/, 'var __sketch = function $1')
        .replace(/export\s+default\s+/, 'var __sketch = ')
        .replace(/export\s+const\s+params\s*=/, 'var __params =')
        .replace(/export\s+(const|let|var|function)\s+/g, '$1 ');

      var build = new Function(code + '\n;return { sketch: typeof __sketch !== "undefined" ? __sketch : null, params: typeof __params !== "undefined" ? __params : null };');
      var out = build();
      factory = out.sketch;
      declared = out.params;
    } catch (e) {
      showError('Failed to evaluate sketch: ' + e.message, e.stack);
      return;
    }

    if (typeof factory !== 'function') {
      showError('Sketch has no default export function.');
      return;
    }

    post({ type: 'schema', params: declared || null });

    try {
      instance = new p5(function (p) {
        // Discrete trigger events a sketch fires itself, as opposed to the
        // continuous per-frame state (params, pointer position) it reads
        // via get(). Field Lines' graze-to-pluck is the first user: the
        // sketch already knows, per frame, which lines the cursor is
        // actually crossing — that's a one-shot event, not a value to
        // poll, so it gets its own call rather than being smuggled into a
        // param. x is normalized 0..1 across the tile; what it means
        // (pitch, in Field Lines' case) is entirely the host's business —
        // this bridge doesn't know or care.
        p.pluck = function (x) {
          post({ type: 'pluck', x: x });
        };

        // Continuous interaction-intensity bridge, for tiles whose sound
        // should respond to how much the user is currently disturbing
        // them rather than playing continuously — see
        // lib/sandbox/protocol.ts's `energy` doc. Unlike p.pluck, this
        // isn't a discrete event: a sketch calls it every draw() frame
        // with its own current 0..1 value (Wound Thread: smoothed
        // physics-sim velocity), and the host decides what to do with a
        // steady stream of updates rather than a one-off. Clamped here
        // so a sketch bug (an unclamped computation, a stray NaN) can't
        // send something nonsensical downstream.
        p.setEnergy = function (v) {
          var n = typeof v === 'number' && isFinite(v) ? v : 0;
          post({ type: 'energy', energy: n < 0 ? 0 : n > 1 ? 1 : n });
        };

        // Live audio bridge: returns the card's own current time-domain
        // waveform (roughly -1..1) while its sound engine is running, or
        // null otherwise — see lib/sandbox/protocol.ts's audioWaveform
        // doc. A sketch that wants a real audio-driven trace (Static
        // Choir) checks this every draw() and falls back to its own
        // generated visual when it's null, exactly like it always did
        // before this bridge existed. Returns the live buffer directly,
        // not a copy — cheap, and fine as long as callers only read it;
        // a sketch should treat the returned array as read-only.
        p.getAudioWaveform = function () {
          return audioEnabled ? audioWaveform : null;
        };

        // Per-band companion to getAudioWaveform above — see
        // HostToSandbox's `bands` field doc in protocol.ts for why this
        // is track-only and returns null far more often. A sketch checks
        // this separately from getAudioWaveform(); getting a real
        // waveform back doesn't guarantee band data came with it (mic
        // and the synth preset never send bands at all).
        p.getAudioBands = function () {
          return audioEnabled ? audioBands : null;
        };

        // Full-resolution companion to getAudioBands above — see
        // HostToSandbox's `spectrum` doc in protocol.ts. Track OR mic
        // (unlike getAudioBands, which is track-only), null for the
        // synth-preset case. p.getAudioSpectrumBinHz() gives the real Hz
        // width of each bin so a sketch can bucket into actual frequency
        // ranges instead of assuming a sample rate.
        p.getAudioSpectrum = function () {
          return audioEnabled ? audioSpectrum : null;
        };

        p.getAudioSpectrumBinHz = function () {
          return audioEnabled ? audioSpectrumBinHz : 0;
        };

        // Resolves a font id (from lib/fonts/manifest.ts, selected via a
        // `font`-kind control) to the p5.Font the host already pushed in
        // — see loadEmbeddedFonts()'s doc above for the data: URL /
        // null-origin reasoning. Returns null (not undefined, not a
        // throw) while still loading, if that id was never sent, or if
        // it failed to fetch host-side — every sketch that calls this
        // already falls back to a plain CSS font-family string when it's
        // falsy, so null is an expected, ordinary return value here, not
        // an error state to guard against separately.
        p.getEmbeddedFont = function (id) {
          return embeddedFonts[id] || null;
        };

        // Run the sketch factory, which assigns p.setup / p.draw.
        var wrapped = factory(p, get);
        if (typeof wrapped === 'function') wrapped(p, get);

        // Wrap draw immediately and synchronously. The previous version
        // polled on a 16ms setInterval waiting for p.draw to appear, which
        // raced p5's own startup and silently gave up if it lost — a sketch
        // that never animated with no error to explain why. The factory has
        // already assigned p.draw by this line, so there is nothing to wait
        // for.
        // Density must be set before the sketch's createCanvas() call, so
        // wrap setup rather than trying to apply it afterwards.
        var userSetup = typeof p.setup === 'function' ? p.setup : null;
        if (userSetup) {
          p.setup = function () {
            // Must run BEFORE createCanvas(), which is inside userSetup —
            // p5 only applies a density change cleanly at canvas creation.
            // At this point p._renderer does not exist yet, so
            // densityFor() cannot tell a 2D sketch from a WEBGL one and
            // conservatively assumes WEBGL. That is the right default; it
            // just isn't the final answer.
            try { p.pixelDensity(densityFor(quality, window.innerWidth, window.innerHeight)); } catch (e) { /* pre-1.x */ }
            userSetup.call(p);
            // createCanvas() has now run, so the renderer mode is
            // knowable. Re-derive the density against the correct budget
            // and only re-apply if it actually differs — pixelDensity()
            // forces a full canvas reallocation, so an unconditional
            // second call would add one to every single mount for no
            // reason. In practice this only fires for a 2D sketch mounted
            // straight into full quality; preview mounts compute 1 both
            // times and skip.
            try {
              var want = densityForRenderer(p._renderer, quality, window.innerWidth, window.innerHeight);
              if (Math.abs(p.pixelDensity() - want) > 0.01) p.pixelDensity(want);
            } catch (e) { /* private/renderer shape changed — keep the conservative value */ }
          };
        }

        var userDraw = typeof p.draw === 'function' ? p.draw : null;

        if (!userDraw) {
          showError('Sketch defines no draw() function.');
          return;
        }

        /*
         * A native fullscreen transition fires several resize events on
         * the iframe's own window in quick succession as it animates from
         * card-size to full-viewport and back — confirmed directly by a
         * captured stack trace: p5's internal _onresize calling the
         * sketch's windowResized, calling resizeCanvas, on a live WEBGL
         * context, mid-transition. That is a known, real trigger for
         * CONTEXT_LOST_WEBGL on some GPU drivers, and unlike a genuine
         * one-off loss elsewhere, this one is entirely avoidable: the
         * intermediate sizes during an animated transition are never
         * where the sketch should actually end up, so there is nothing
         * lost by waiting for them to stop before resizing at all.
         *
         * Debouncing here — rather than only recovering after the fact via
         * webglcontextlost/restored below — fixes this at the source for
         * the common case (a deliberate fullscreen toggle) rather than
         * leaning entirely on recovery, which the browser is not obligated
         * to grant: a lost WEBGL context has no guaranteed restoration.
         */
        var userWindowResized = typeof p.windowResized === 'function' ? p.windowResized : null;

        applyResize = function (w, h) {
          if (contextLost) return;
          // Recompute density against the size the canvas is about to
          // become, before resizing into it — density was only ever set
          // once at initial setup, at whatever size the sketch started at.
          try {
            p.pixelDensity(densityFor(quality, w, h));
          } catch (e) { /* pre-1.x */ }
          /*
           * userWindowResized's own resizeCanvas call reads
           * p.windowWidth/p.windowHeight internally (every sketch writes
           * it that way, not parameterized) — not the w/h passed in here.
           *
           * THE ASSUMPTION THAT USED TO BE DOCUMENTED HERE WAS WRONG, and
           * it was the cause of the "fullscreen renders at the old size in
           * the top-left corner" bug. The old note reasoned that layout
           * would have caught up by the time this ran, so the values would
           * be current. But p.windowWidth is not read from layout at all —
           * it is a CACHED property. Confirmed directly against the
           * vendored p5 build:
           *
           *   p5.prototype.windowWidth = 0
           *   p5.prototype._onresize = function (e) {
           *     this._setProperty('windowWidth',  getWindowWidth());
           *     this._setProperty('windowHeight', getWindowHeight());
           *     ... calls the sketch's windowResized ...
           *   }
           *   p5.prototype._updateWindowSize = function () {
           *     this._setProperty('windowWidth',  getWindowWidth());
           *     this._setProperty('windowHeight', getWindowHeight());
           *   }
           *
           * Those are the ONLY two writers. The host-driven path calls
           * userWindowResized directly and therefore never goes through
           * _onresize, so whatever size _onresize last happened to cache
           * is what the sketch resizes itself to — typically an
           * intermediate frame of the animated fullscreen transition, or
           * the pre-fullscreen panel size. The density above was computed
           * from the correct w/h, so only the canvas geometry came out
           * wrong, which is exactly how it presented: a correctly-rendered
           * sketch at the old dimensions, anchored top-left in a
           * full-screen black box.
           *
           * Refreshing the cache first removes the whole staleness class
           * rather than patching one symptom. _updateWindowSize is a
           * private p5 API, so it's feature-detected with an explicit
           * _setProperty fallback; if both ever disappear, behaviour
           * degrades to what it was before this fix rather than throwing.
           */
          try {
            if (typeof p._updateWindowSize === 'function') {
              p._updateWindowSize();
            } else if (typeof p._setProperty === 'function') {
              p._setProperty('windowWidth', window.innerWidth);
              p._setProperty('windowHeight', window.innerHeight);
            }
          } catch (e) { /* private API moved — fall through with whatever is cached */ }

          // Recorded AFTER the refresh above so it reflects the size the
          // sketch is actually about to be resized to, not whatever was
          // cached on entry. Read by the windowResized fallback below.
          lastAppliedWindowW = window.innerWidth;
          lastAppliedWindowH = window.innerHeight;

          if (userWindowResized) userWindowResized.call(p);
        };

        if (userWindowResized) {
          p.windowResized = function () {
            // Fallback path only. The host's explicit 'resize' message
            // (driven by a ResizeObserver on the actual container, handled
            // in the outer message listener below) is the primary trigger
            // now — it's a real "layout has settled" signal, unlike this
            // iframe's own internal resize events, which is what made a
            // pure debounce-on-resize approach unreliable during animated
            // fullscreen transitions in the first place. This still fires
            // for any resize the host didn't explicitly announce.
            //
            // BUG THAT WAS HERE: this timer and the host's message timer
            // run on independent clocks (~220ms vs ~200ms + a postMessage
            // round-trip). If this one fired first, cancelling it on
            // message arrival did nothing — it had already run. Both paths
            // then called applyResize() for the SAME resize, each doing a
            // full resizeCanvas(). Confirmed directly in a console capture:
            // repeated 'message' handler violations at 300-800ms each,
            // stacking past the 2000ms heartbeat timeout and causing the
            // host to tear the iframe down as a hung sketch — the "renders
            // in fullscreen but comes back blank" failure. The guard below
            // makes this an actual fallback instead of a second guaranteed
            // trigger: skip if the host visibly handled a resize recently.
            //
            // REVISED — the guard was purely time-based, and that made it
            // possible for it to swallow the one call that would have
            // corrected a stale resize. p5 calls this from inside
            // _onresize, immediately AFTER _onresize has written the
            // correct windowWidth/windowHeight. During an animated
            // fullscreen transition the host's message routinely lands
            // first (it fires 200ms after the ResizeObserver settles,
            // while the iframe's own resize events are still arriving), so
            // applyResize ran against a mid-transition size and this — the
            // only remaining path back to the right one — then returned
            // early because it was inside the 600ms window. Intermittent
            // by construction: whether the final _onresize fell inside or
            // outside that window was a race against the transition.
            //
            // The fix is to make the guard answer the question it was
            // always trying to answer — "has the host already handled THIS
            // size?" — instead of the proxy question "has the host been
            // heard from lately?". If applyResize last ran at the window
            // size the window is at right now, the sketch has already been
            // resized correctly and running again would be a duplicate
            // resizeCanvas (the expensive thing this guard exists to
            // prevent: p5 1.x's resizeCanvas has no same-size early return,
            // it does the full resize plus a redraw() every time, which is
            // what stacked past the 2000ms heartbeat and got iframes torn
            // down as hung). If the window has moved on since, the sketch
            // is currently at the wrong size and this must run regardless
            // of how recently the host was heard from.
            //
            // Deliberately compares WINDOW size, not canvas size: not
            // every sketch sizes its canvas to the full window (some
            // aspect-fit, some use a fixed size), so a canvas-vs-window
            // comparison would never match for those and would reintroduce
            // the duplicate-resize storm for exactly the sketches that
            // can least afford it. Window-vs-window is true regardless of
            // what the sketch chooses to do with the space.
            var recentlyHandledByHost = performance.now() - lastHostResizeAt < 600;
            var hostAlreadyHandledThisSize =
              window.innerWidth === lastAppliedWindowW &&
              window.innerHeight === lastAppliedWindowH;
            if (recentlyHandledByHost && hostAlreadyHandledThisSize) return;

            if (resizeDebounceTimer) clearTimeout(resizeDebounceTimer);
            resizeDebounceTimer = setTimeout(function () {
              resizeDebounceTimer = null;
              applyResize(window.innerWidth, window.innerHeight);
            }, 220);
          };
        }

        p.draw = function () {
          if (paused || contextLost || drawFailed) return;
          /*
           * p5.js has a well-known internal behavior: if the sketch's own
           * draw() throws, p5 catches it, logs to console, and calls
           * noLoop() to halt — silently, without re-throwing. That means
           * window.onerror below never fires, so the host never finds
           * out, and the canvas just freezes on whatever was last
           * painted. If that happened mid-frame (background() painted,
           * panels not yet drawn), it reads as a permanent black tile
           * with no visible error anywhere — exactly the "silent
           * failure" this project's own conventions call out as the
           * thing to avoid. Wrapping the call here guarantees showError()
           * fires (and the host sees a real error badge, not a dead
           * animation) regardless of whether p5's own internal handling
           * would have swallowed it.
           */
          try {
            var drawStarted = profileEnabled ? performance.now() : 0;
            userDraw.call(p);
            if (profileEnabled) profileSample(drawTimings, performance.now() - drawStarted);
          } catch (e) {
            drawFailed = true;
            showError('Sketch threw during draw(): ' + e.message, e.stack);
            try { instance && instance.noLoop && instance.noLoop(); } catch (e2) { /* already gone */ }
            return;
          }
          sendVfxFrame();
          frame++;
          fpsFrames++;
          var now = performance.now();
          if (now - lastFpsAt > 1000) {
            fps = Math.round((fpsFrames * 1000) / (now - lastFpsAt));
            fpsFrames = 0;
            lastFpsAt = now;
          }
        };
      });
    } catch (e) {
      showError('Sketch threw during setup: ' + e.message, e.stack);
      return;
    }

    // Catch up the fresh instance on every font the host has already
    // sent this session — a hot-reload of the sketch source (or a
    // WebGL-recovery re-run) creates a brand new p5 instance, and the
    // p.Font objects from the OLD one don't carry over (see teardown()'s
    // embeddedFonts reset). The raw data URLs did carry over, in
    // fontDataUrls, so this just re-runs p.loadFont() against them
    // rather than needing the host to resend anything.
    loadAllKnownFontsIntoCurrentInstance();

    /*
     * WebGL context-loss recovery. Only relevant to WEBGL-mode sketches —
     * a 2D canvas has no GL context to lose, so these listeners simply
     * never fire for one. Attached fresh after every run() rather than
     * once at load, since teardown() removes the canvas element entirely
     * and p5 creates a brand new one on each run.
     *
     * A resize that changes an iframe's dimensions drastically and near-
     * instantly — which is exactly what a fullscreen transition does — is
     * a real, observed trigger for CONTEXT_LOST_WEBGL on some GPU drivers.
     * Before this, that was unrecoverable: the sandbox had no listener, so
     * the next draw call (or, worse, the browser's own attempt to hand the
     * sketch a canvas again) just threw "Error creating webgl context"
     * forever, until the whole focused view was closed and reopened.
     *
     * The fix mirrors lib/gl/context-pool.ts's own established pattern for
     * the shared shader context — "restores from source hash" — because a
     * lost WEBGL context can't just resume where it left off. Every buffer,
     * shader, and piece of GL state is gone; the only correct recovery is
     * running setup() again from scratch, which is what run(lastSource)
     * does here.
     */
    var canvas = document.querySelector('canvas');
    if (canvas) {
      canvas.addEventListener('webglcontextlost', function (ev) {
        // preventDefault() is not optional — without it the browser
        // assumes the page has no recovery story and will never fire
        // webglcontextrestored at all, per the WebGL spec.
        ev.preventDefault();
        contextLost = true;
        /*
         * Automatic backoff for the raised WEBGL density budget above.
         *
         * The budget was raised so fullscreen renders at native resolution
         * on a DPR-2 panel, which is the whole point of this change — but
         * the failure it replaced was real, and "some GPU drivers" is not a
         * set that can be enumerated ahead of time. Rather than pick a
         * constant conservative enough for the worst machine anyone might
         * ever use (which is exactly how the previous value ended up
         * penalising every machine), this treats a genuine loss as the
         * measurement: halve the budget, floor it at the previously-shipped
         * value, and never raise it again for this iframe's lifetime.
         *
         * Placed on the loss event rather than the restore event
         * deliberately. The restore handler below has its own backoff for a
         * different problem (repeated losses meaning the GPU is out of
         * contexts entirely, where recreating the sketch is the wrong
         * move); this one is about the size of a single allocation, so it
         * needs to have already taken effect by the time recreation
         * recomputes its density.
         */
        if (webglPixelBudget > WEBGL_PIXELS_FLOOR) {
          webglPixelBudget = Math.max(WEBGL_PIXELS_FLOOR, Math.floor(webglPixelBudget / 2));
        }
        if (instance && instance.noLoop) {
          try { instance.noLoop(); } catch (e) { /* already gone */ }
        }
      }, false);

      canvas.addEventListener('webglcontextrestored', function () {
        var now = performance.now();
        // A genuine one-off loss (a fullscreen transition, a GPU driver
        // hiccup) recovers here cleanly. But each live WEBGL-mode p5
        // sketch holds its OWN browser-level WebGL context, entirely
        // separate from and uncounted by the app's shared shader context
        // pool — if several such sketches are live on the board at once,
        // the browser's hard cap on total contexts (most browsers allow
        // roughly 8-16 before silently killing the oldest) can genuinely
        // be at or past capacity. Recreating unconditionally in THAT case
        // doesn't fix anything — the total count never drops, so the new
        // context (or a neighboring sketch's) just gets evicted again
        // immediately, and unconditional recreation turns a quiet, isolated
        // one-time failure into an active thrash competing for the same
        // scarce resource. Two recoveries within 3s of each other is
        // treated as that thrash, not a transition — stop retrying and
        // surface it plainly instead of stuttering forever.
        if (now - lastRecoveryAt < 3000) {
          recoveryStreak++;
          if (recoveryStreak >= 2) {
            showError(
              'Too many live 3D views open at once. Protip: refresh the app.'
            );
            return;
          }
        } else {
          recoveryStreak = 0;
        }
        lastRecoveryAt = now;
        run(lastSource);
      }, false);

      // Pointer presence, forwarded to the host for interaction-gated sound
      // presets (Field Lines' arp only plays while genuinely hovered — see
      // lib/sound/engine.ts's setTileHovering()). Same reasoning as the key
      // forwarding below: this cross-origin iframe's own hover state never
      // reaches the host on its own. Attached here rather than at load for
      // the same reason the context-loss listeners are — teardown() removes
      // the canvas and run() creates a fresh one every time, so a listener
      // bound once at load would be watching a detached element after the
      // first re-run. Works for both 2D and WEBGL canvases alike, unlike
      // the context-loss listeners above which only apply to WEBGL.
      canvas.addEventListener('pointerenter', function () {
        post({ type: 'hover', hovering: true });
      });
      canvas.addEventListener('pointerleave', function () {
        post({ type: 'hover', hovering: false });
      });
    }

    post({ type: 'ready' });
  }

  /*
   * Forward the host's shortcut keys back up. This iframe is cross-origin
   * (sandbox="allow-scripts", null origin), so its key events never bubble
   * to the host document. Once a person clicks or drags inside a sketch,
   * focus lives in here and every host shortcut silently stopped working
   * until they clicked back out — the "F key sometimes does nothing" bug.
   * Only the keys the host actually binds are forwarded; everything else
   * stays local so sketches keep their own keyboard behaviour.
   */
  var FORWARDED_KEYS = { f: true, F: true, Escape: true };
  window.addEventListener('keydown', function (e) {
    if (!FORWARDED_KEYS[e.key]) return;
    post({ type: 'key', key: e.key });
  });

  window.addEventListener('message', function (e) {
    if (e.source !== parent) return;
    var msg = e.data;
    if (!msg || typeof msg !== 'object') return;

    switch (msg.type) {
      case 'init':
        profileEnabled = msg.profile === true;
        drawTimings.length = 0;
        captureTimings.length = 0;
        params = msg.params || {};
        run(msg.source || '');
        // Per protocol.ts's `fonts` field doc, `fonts` is attachable to
        // `init` as well as sent standalone — the current host
        // (p5.renderer.ts) always sends a separate 'fonts' message
        // rather than attaching it here, but handling it on both is
        // cheap and keeps this sandbox honoring the full documented
        // contract rather than only the one shape the host happens to
        // send today.
        if (msg.fonts) loadEmbeddedFonts(msg.fonts);
        break;
      case 'params':
        if (msg.params) params = msg.params;
        else if (msg.id !== undefined) params[msg.id] = msg.value;
        break;
      case 'fonts':
        loadEmbeddedFonts(msg.fonts);
        break;
      case 'event':
        if (instance && instance.onEvent) {
          try { instance.onEvent(msg.event); } catch (err) { showError(String(err)); }
        }
        break;
      case 'resize':
        // The host's ResizeObserver-driven signal that the container has
        // actually settled at a new size — see applyResize's definition
        // in run() for why this is preferred over the internal fallback.
        lastHostResizeAt = performance.now();
        if (resizeDebounceTimer) {
          clearTimeout(resizeDebounceTimer);
          resizeDebounceTimer = null;
        }
        if (applyResize && typeof msg.width === 'number' && typeof msg.height === 'number') {
          applyResize(msg.width, msg.height);
        }
        break;
      case 'quality':
        quality = msg.quality || 'preview';
        if (instance && instance.pixelDensity) {
          try { instance.pixelDensity(densityFor(quality, window.innerWidth, window.innerHeight)); } catch (e) { /* ignore */ }
        }
        break;
      case 'audioWaveform':
        audioEnabled = !!msg.enabled;
        audioWaveform = audioEnabled ? (msg.waveform || null) : null;
        audioBands = audioEnabled ? (msg.bands || null) : null;
        audioSpectrum = audioEnabled ? (msg.spectrum || null) : null;
        audioSpectrumBinHz = audioEnabled ? (msg.spectrumBinHz || 0) : 0;
        break;
      case 'play': paused = false; if (instance && instance.loop) instance.loop(); break;
      case 'pause': paused = true; break;
      case 'vfx-frame':
        if (!Number.isSafeInteger(msg.requestId) || msg.requestId<1 ||
            !Number.isInteger(msg.width) || !Number.isInteger(msg.height) ||
            msg.width<1 || msg.height<1 || msg.width>2048 || msg.height>2048 ||
            msg.width*msg.height>2097152 || vfxBusy) break;
        // A host timeout supersedes its old request; keep only the newest.
        vfxRequest={requestId:msg.requestId,width:msg.width,height:msg.height};
        // Running WEBGL sketches capture immediately after draw, before the
        // browser discards the backbuffer. Static/paused sketches use last frame.
        if (paused || (instance && instance.isLooping && !instance.isLooping())) sendVfxFrame();
        break;
      case 'capture':
        try {
          var cv = document.querySelector('canvas');
          post({ type: 'captured', requestId: msg.requestId, dataUrl: cv ? cv.toDataURL('image/png') : null });
        } catch (err) {
          post({ type: 'captured', requestId: msg.requestId, dataUrl: null });
        }
        break;
    }
  });

  setInterval(function () {
    post({ type: 'heartbeat', fps: fps, frame: frame,
      drawP95Ms: profileEnabled ? profileP95(drawTimings) : undefined,
      captureP95Ms: profileEnabled ? profileP95(captureTimings) : undefined });
  }, 500);
})();
</script>
</body>
</html>
