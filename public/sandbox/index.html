<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sketch sandbox</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #err {
    position: fixed; inset: 0; padding: 12px;
    font: 11px/1.5 ui-monospace, monospace;
    color: #ff8080; background: rgba(0,0,0,.92);
    white-space: pre-wrap; overflow: auto; display: none;
  }
</style>
</head>
<body>
<div id="err"></div>
<script src="/vendor/p5.min.js"></script>
<script>
/*
 * Sandbox bootstrap.
 *
 * Runs in an iframe with a null origin. Receives sketch source over
 * postMessage, evaluates it here, and reports schema, errors, and a heartbeat
 * back to the host. Nothing in here can reach the host page's DOM or state.
 */
(function () {
  var instance = null;
  var params = {};
  var errEl = document.getElementById('err');
  var frame = 0;
  var lastFpsAt = performance.now();
  var fpsFrames = 0;
  var fps = 0;
  var paused = false;
  var quality = 'preview';
  // Set at the top of every run() and never anywhere else — the one thing
  // webglcontextrestored needs to fully recreate the sketch from scratch.
  var lastSource = '';
  // True between a context-loss event and successful recovery. draw()
  // checks this so it doesn't keep calling into a dead WebGL context every
  // frame while waiting — that would either throw repeatedly or silently
  // no-op depending on the browser, neither of which is better than just
  // pausing until restoration actually happens.
  var contextLost = false;
  // Backoff bookkeeping for webglcontextrestored — see the comment at that
  // listener for why unconditional recreation on every loss is unsafe.
  var lastRecoveryAt = 0;
  var recoveryStreak = 0;
  // Debounce handle for the windowResized guard below. Module-scoped (not
  // local to run()'s p5 closure) so teardown() can always cancel a pending
  // call regardless of which run() scheduled it — otherwise a timer from a
  // just-torn-down instance could fire into a disposed `p` afterwards.
  var resizeDebounceTimer = null;
  // Set inside run(), for the outer message handler below to call directly
  // when the host sends an explicit 'resize' message — see the comment at
  // that handler for why this exists alongside the internal debounce.
  var applyResize = null;
  // Set whenever the host's explicit 'resize' message is handled — lets
  // the internal fallback below tell "the host already covered this" from
  // "the host never sent anything," instead of firing unconditionally and
  // racing it. See the case 'resize' handler for the full story.
  var lastHostResizeAt = 0;

  /*
   * Pixel density is the difference between a smooth thumbnail and a
   * stuttering one. p5 defaults to the display density, so on a retina
   * screen every sketch was rendering at 2x — four times the pixels — even
   * for a 220px card. Preview cards are forced to 1x; only the focused
   * view pays for the sharper buffer.
   *
   * That flat "2x on retina, always" rule broke down at fullscreen size.
   * A confirmed A/B test (same sketches, same GPU, retina vs. non-retina
   * display) showed WEBGL sketches losing context specifically on retina
   * fullscreen and nowhere else — the drawing buffer at native fullscreen
   * resolution * 2x density is a real, large one-shot GPU allocation, and
   * that combination is what a driver actually chokes on, not the resize
   * event timing. The same 2x-everywhere rule is also the leading
   * suspect for the general stutter on retina, independent of fullscreen:
   * every WEBGL sketch pushes 4x the pixels per frame at "full" quality
   * whenever a retina display is involved, all the time.
   *
   * Budgeting by total framebuffer pixel count rather than a flat
   * multiplier keeps both costs bounded: a small enlarged-tile card still
   * gets the full 2x sharpness (its pixel count is nowhere near the
   * budget), while fullscreen on retina scales density back down rather
   * than compounding a large canvas with a large multiplier.
   */
  var MAX_FRAMEBUFFER_PIXELS = 4000000; // ~2000x2000 at 1x — tune against real profiling, not guessed once and left
  function densityFor(q, targetW, targetH) {
    if (q !== 'full') return 1;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = targetW || window.innerWidth;
    var h = targetH || window.innerHeight;
    var logicalPixels = w * h;
    if (logicalPixels <= 0) return dpr;
    var wouldBePixels = logicalPixels * dpr * dpr;
    if (wouldBePixels <= MAX_FRAMEBUFFER_PIXELS) return dpr;
    // Scale density down so total framebuffer pixels stay under budget,
    // never below 1 — a canvas this large already costs plenty at 1x.
    return Math.max(1, Math.sqrt(MAX_FRAMEBUFFER_PIXELS / logicalPixels));
  }

  function post(msg) { parent.postMessage(msg, '*'); }

  function showError(message, stack) {
    errEl.style.display = 'block';
    errEl.textContent = message + (stack ? '\n\n' + stack : '');
    post({ type: 'error', message: message, stack: stack });
  }

  function clearError() {
    errEl.style.display = 'none';
    errEl.textContent = '';
  }

  window.onerror = function (message, _src, line, col, error) {
    showError(String(message) + ' (line ' + line + ':' + col + ')', error && error.stack);
    return true;
  };

  window.addEventListener('unhandledrejection', function (e) {
    showError('Unhandled promise rejection: ' + String(e.reason));
  });

  function get(id) {
    var v = params[id];
    return v === undefined ? null : v;
  }

  function teardown() {
    if (resizeDebounceTimer) {
      clearTimeout(resizeDebounceTimer);
      resizeDebounceTimer = null;
    }
    applyResize = null;
    if (instance && instance.remove) {
      try { instance.remove(); } catch (e) { /* already gone */ }
    }
    instance = null;
    var c = document.querySelectorAll('canvas');
    for (var i = 0; i < c.length; i++) c[i].remove();
  }

  function run(source) {
    teardown();
    clearError();
    frame = 0;
    lastSource = source;
    contextLost = false;

    var factory, declared;

    try {
      // Strip ES module syntax: the sandbox evaluates a plain script so it
      // works without a build step and without dynamic import of blob URLs.
      var code = source
        .replace(/export\s+default\s+function\s+(\w+)/, 'var __sketch = function $1')
        .replace(/export\s+default\s+/, 'var __sketch = ')
        .replace(/export\s+const\s+params\s*=/, 'var __params =')
        .replace(/export\s+(const|let|var|function)\s+/g, '$1 ');

      var build = new Function(code + '\n;return { sketch: typeof __sketch !== "undefined" ? __sketch : null, params: typeof __params !== "undefined" ? __params : null };');
      var out = build();
      factory = out.sketch;
      declared = out.params;
    } catch (e) {
      showError('Failed to evaluate sketch: ' + e.message, e.stack);
      return;
    }

    if (typeof factory !== 'function') {
      showError('Sketch has no default export function.');
      return;
    }

    post({ type: 'schema', params: declared || null });

    try {
      instance = new p5(function (p) {
        // Run the sketch factory, which assigns p.setup / p.draw.
        var wrapped = factory(p, get);
        if (typeof wrapped === 'function') wrapped(p, get);

        // Wrap draw immediately and synchronously. The previous version
        // polled on a 16ms setInterval waiting for p.draw to appear, which
        // raced p5's own startup and silently gave up if it lost — a sketch
        // that never animated with no error to explain why. The factory has
        // already assigned p.draw by this line, so there is nothing to wait
        // for.
        // Density must be set before the sketch's createCanvas() call, so
        // wrap setup rather than trying to apply it afterwards.
        var userSetup = typeof p.setup === 'function' ? p.setup : null;
        if (userSetup) {
          p.setup = function () {
            try { p.pixelDensity(densityFor(quality, window.innerWidth, window.innerHeight)); } catch (e) { /* pre-1.x */ }
            userSetup.call(p);
          };
        }

        var userDraw = typeof p.draw === 'function' ? p.draw : null;

        if (!userDraw) {
          showError('Sketch defines no draw() function.');
          return;
        }

        /*
         * A native fullscreen transition fires several resize events on
         * the iframe's own window in quick succession as it animates from
         * card-size to full-viewport and back — confirmed directly by a
         * captured stack trace: p5's internal _onresize calling the
         * sketch's windowResized, calling resizeCanvas, on a live WEBGL
         * context, mid-transition. That is a known, real trigger for
         * CONTEXT_LOST_WEBGL on some GPU drivers, and unlike a genuine
         * one-off loss elsewhere, this one is entirely avoidable: the
         * intermediate sizes during an animated transition are never
         * where the sketch should actually end up, so there is nothing
         * lost by waiting for them to stop before resizing at all.
         *
         * Debouncing here — rather than only recovering after the fact via
         * webglcontextlost/restored below — fixes this at the source for
         * the common case (a deliberate fullscreen toggle) rather than
         * leaning entirely on recovery, which the browser is not obligated
         * to grant: a lost WEBGL context has no guaranteed restoration.
         */
        var userWindowResized = typeof p.windowResized === 'function' ? p.windowResized : null;

        applyResize = function (w, h) {
          if (contextLost) return;
          // Recompute density against the size the canvas is about to
          // become, before resizing into it — density was only ever set
          // once at initial setup, at whatever size the sketch started at.
          try {
            p.pixelDensity(densityFor(quality, w, h));
          } catch (e) { /* pre-1.x */ }
          // NOTE: userWindowResized's own resizeCanvas call reads
          // p.windowWidth/p.windowHeight internally (every sketch writes
          // it that way, not parameterized) — not the w/h passed in here.
          // That's fine as long as this iframe's own layout has already
          // caught up to its new CSS size by the time this runs, which it
          // has: the host's ResizeObserver only fires after the browser
          // has finished layout, and postMessage is asynchronous on top of
          // that, so p.windowWidth/windowHeight are reliably current by
          // the time this executes. Called out explicitly because it's an
          // assumption, not a guarantee enforced anywhere in code.
          if (userWindowResized) userWindowResized.call(p);
        };

        if (userWindowResized) {
          p.windowResized = function () {
            // Fallback path only. The host's explicit 'resize' message
            // (driven by a ResizeObserver on the actual container, handled
            // in the outer message listener below) is the primary trigger
            // now — it's a real "layout has settled" signal, unlike this
            // iframe's own internal resize events, which is what made a
            // pure debounce-on-resize approach unreliable during animated
            // fullscreen transitions in the first place. This still fires
            // for any resize the host didn't explicitly announce.
            //
            // BUG THAT WAS HERE: this timer and the host's message timer
            // run on independent clocks (~220ms vs ~200ms + a postMessage
            // round-trip). If this one fired first, cancelling it on
            // message arrival did nothing — it had already run. Both paths
            // then called applyResize() for the SAME resize, each doing a
            // full resizeCanvas(). Confirmed directly in a console capture:
            // repeated 'message' handler violations at 300-800ms each,
            // stacking past the 2000ms heartbeat timeout and causing the
            // host to tear the iframe down as a hung sketch — the "renders
            // in fullscreen but comes back blank" failure. The guard below
            // makes this an actual fallback instead of a second guaranteed
            // trigger: skip if the host visibly handled a resize recently.
            var recentlyHandledByHost = performance.now() - lastHostResizeAt < 600;
            if (recentlyHandledByHost) return;

            if (resizeDebounceTimer) clearTimeout(resizeDebounceTimer);
            resizeDebounceTimer = setTimeout(function () {
              resizeDebounceTimer = null;
              applyResize(window.innerWidth, window.innerHeight);
            }, 220);
          };
        }

        p.draw = function () {
          if (paused || contextLost) return;
          userDraw.call(p);
          frame++;
          fpsFrames++;
          var now = performance.now();
          if (now - lastFpsAt > 1000) {
            fps = Math.round((fpsFrames * 1000) / (now - lastFpsAt));
            fpsFrames = 0;
            lastFpsAt = now;
          }
        };
      });
    } catch (e) {
      showError('Sketch threw during setup: ' + e.message, e.stack);
      return;
    }

    /*
     * WebGL context-loss recovery. Only relevant to WEBGL-mode sketches —
     * a 2D canvas has no GL context to lose, so these listeners simply
     * never fire for one. Attached fresh after every run() rather than
     * once at load, since teardown() removes the canvas element entirely
     * and p5 creates a brand new one on each run.
     *
     * A resize that changes an iframe's dimensions drastically and near-
     * instantly — which is exactly what a fullscreen transition does — is
     * a real, observed trigger for CONTEXT_LOST_WEBGL on some GPU drivers.
     * Before this, that was unrecoverable: the sandbox had no listener, so
     * the next draw call (or, worse, the browser's own attempt to hand the
     * sketch a canvas again) just threw "Error creating webgl context"
     * forever, until the whole focused view was closed and reopened.
     *
     * The fix mirrors lib/gl/context-pool.ts's own established pattern for
     * the shared shader context — "restores from source hash" — because a
     * lost WEBGL context can't just resume where it left off. Every buffer,
     * shader, and piece of GL state is gone; the only correct recovery is
     * running setup() again from scratch, which is what run(lastSource)
     * does here.
     */
    var canvas = document.querySelector('canvas');
    // DIAGNOSTIC — temporary, paired with the two logs above.
    console.warn('[diag] canvas after run()', {
      exists: !!canvas,
      w: canvas ? canvas.width : null,
      h: canvas ? canvas.height : null,
    });
    if (canvas) {
      canvas.addEventListener('webglcontextlost', function (ev) {
        // DIAGNOSTIC — temporary. The resize debounce alone didn't resolve
        // the fullscreen render failure, so rather than guess again, log
        // directly on the events themselves to see what's actually
        // happening: does loss fire at all, and at what canvas size?
        console.warn('[diag] webglcontextlost', {
          canvasW: canvas.width,
          canvasH: canvas.height,
          clientW: canvas.clientWidth,
          clientH: canvas.clientHeight,
          fullscreenElement: !!document.fullscreenElement,
          t: performance.now(),
        });
        // preventDefault() is not optional — without it the browser
        // assumes the page has no recovery story and will never fire
        // webglcontextrestored at all, per the WebGL spec.
        ev.preventDefault();
        contextLost = true;
        if (instance && instance.noLoop) {
          try { instance.noLoop(); } catch (e) { /* already gone */ }
        }
      }, false);

      canvas.addEventListener('webglcontextrestored', function () {
        // DIAGNOSTIC — temporary, paired with the log above.
        console.warn('[diag] webglcontextrestored', { t: performance.now() });
        var now = performance.now();
        // A genuine one-off loss (a fullscreen transition, a GPU driver
        // hiccup) recovers here cleanly. But each live WEBGL-mode p5
        // sketch holds its OWN browser-level WebGL context, entirely
        // separate from and uncounted by the app's shared shader context
        // pool — if several such sketches are live on the board at once,
        // the browser's hard cap on total contexts (most browsers allow
        // roughly 8-16 before silently killing the oldest) can genuinely
        // be at or past capacity. Recreating unconditionally in THAT case
        // doesn't fix anything — the total count never drops, so the new
        // context (or a neighboring sketch's) just gets evicted again
        // immediately, and unconditional recreation turns a quiet, isolated
        // one-time failure into an active thrash competing for the same
        // scarce resource. Two recoveries within 3s of each other is
        // treated as that thrash, not a transition — stop retrying and
        // surface it plainly instead of stuttering forever.
        if (now - lastRecoveryAt < 3000) {
          recoveryStreak++;
          if (recoveryStreak >= 2) {
            showError(
              'Too many live 3D views open at once. Protip: refresh the app.'
            );
            return;
          }
        } else {
          recoveryStreak = 0;
        }
        lastRecoveryAt = now;
        run(lastSource);
      }, false);
    }

    post({ type: 'ready' });
  }

  /*
   * Forward the host's shortcut keys back up. This iframe is cross-origin
   * (sandbox="allow-scripts", null origin), so its key events never bubble
   * to the host document. Once a person clicks or drags inside a sketch,
   * focus lives in here and every host shortcut silently stopped working
   * until they clicked back out — the "F key sometimes does nothing" bug.
   * Only the keys the host actually binds are forwarded; everything else
   * stays local so sketches keep their own keyboard behaviour.
   */
  var FORWARDED_KEYS = { f: true, F: true, Escape: true };
  window.addEventListener('keydown', function (e) {
    if (!FORWARDED_KEYS[e.key]) return;
    post({ type: 'key', key: e.key });
  });

  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || typeof msg !== 'object') return;

    switch (msg.type) {
      case 'init':
        params = msg.params || {};
        run(msg.source || '');
        break;
      case 'params':
        if (msg.params) params = msg.params;
        else if (msg.id !== undefined) params[msg.id] = msg.value;
        break;
      case 'event':
        if (instance && instance.onEvent) {
          try { instance.onEvent(msg.event); } catch (err) { showError(String(err)); }
        }
        break;
      case 'resize':
        // The host's ResizeObserver-driven signal that the container has
        // actually settled at a new size — see applyResize's definition
        // in run() for why this is preferred over the internal fallback.
        lastHostResizeAt = performance.now();
        if (resizeDebounceTimer) {
          clearTimeout(resizeDebounceTimer);
          resizeDebounceTimer = null;
        }
        if (applyResize && typeof msg.width === 'number' && typeof msg.height === 'number') {
          applyResize(msg.width, msg.height);
        }
        break;
      case 'quality':
        quality = msg.quality || 'preview';
        if (instance && instance.pixelDensity) {
          try { instance.pixelDensity(densityFor(quality, window.innerWidth, window.innerHeight)); } catch (e) { /* ignore */ }
        }
        break;
      case 'play': paused = false; if (instance && instance.loop) instance.loop(); break;
      case 'pause': paused = true; break;
      case 'capture':
        try {
          var cv = document.querySelector('canvas');
          post({ type: 'captured', requestId: msg.requestId, dataUrl: cv ? cv.toDataURL('image/png') : null });
        } catch (err) {
          post({ type: 'captured', requestId: msg.requestId, dataUrl: null });
        }
        break;
    }
  });

  setInterval(function () {
    post({ type: 'heartbeat', fps: fps, frame: frame });
  }, 500);
})();
</script>
</body>
</html>
